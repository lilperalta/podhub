<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pod Hub | Premium Vapes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: white; scroll-behavior: smooth; }
        .bg-gradient-brand { background: linear-gradient(135deg, #f97316, #ea580c); }
        
        .product-card {
            background: #111;
            border: 1px solid #1f2937;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .product-card:hover { border-color: #f97316; transform: translateY(-5px); }
        
        .cart-sidebar {
            position: fixed; top: 0; right: -100%; width: 100%; max-width: 400px;
            height: 100%; background: #0a0a0a; z-index: 1000;
            transition: right 0.4s ease; border-left: 1px solid #333;
        }
        .cart-sidebar.open { right: 0; }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 999; backdrop-filter: blur(4px); }
        .overlay.active { display: block; }
        
        /* Barra de scroll estilizada (ahora visible) */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #f97316; }
    </style>
</head>
<body>

    <header class="sticky top-0 z-50 bg-black/95 backdrop-blur-lg border-b border-gray-900">
        <div class="container mx-auto px-4 py-4 flex items-center justify-between gap-4">
            
            <div class="flex items-center flex-shrink-0">
                <span class="text-2xl font-black tracking-tighter uppercase italic">
                    POD<span class="text-orange-500">HUB</span>
                </span>
            </div>

            <div class="flex-1 max-w-md">
                <div class="relative">
                    <input type="text" id="search-input" onkeyup="filterProducts()" 
                           placeholder="Buscá tu sabor..." 
                           class="w-full bg-gray-900 border border-gray-800 text-white rounded-full py-2 px-5 pl-10 focus:outline-none focus:border-orange-500 text-sm">
                    <svg class="absolute left-3 top-2.5 text-gray-500" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
            </div>

            <button onclick="toggleCart()" class="relative p-2 bg-gray-900 rounded-xl border border-gray-800 hover:border-orange-500 transition-colors">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                <span id="cart-count" class="absolute -top-1 -right-1 bg-orange-500 text-black text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
            </button>
        </div>
    </header>

    <section class="py-16 px-4 text-center bg-gradient-to-b from-orange-900/10 to-transparent">
        <h1 class="text-6xl md:text-8xl font-black tracking-tighter mb-4 italic uppercase">POD <span class="text-orange-500">HUB</span></h1>
        <p class="text-gray-400 text-lg md:text-xl font-medium max-w-2xl mx-auto leading-tight uppercase tracking-tighter">
            Vapes de alta calidad para los más exigentes. <br class="hidden md:block"> Directo a tus manos.
        </p>
    </section>

    <div class="bg-orange-600/10 border-y border-orange-500/20 py-4">
        <div class="container mx-auto px-4 flex flex-col md:flex-row justify-center items-center gap-6 text-xs md:text-sm font-black uppercase tracking-widest text-orange-500">
            <div class="flex items-center gap-2">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                Efectivo y Transferencia
            </div>
            <div class="hidden md:block w-px h-4 bg-orange-500/30"></div>
            <div class="flex items-center gap-2 text-white">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"></path></svg>
                Originales 100%
            </div>
            <div class="hidden md:block w-px h-4 bg-orange-500/30"></div>
            <div class="flex items-center gap-2">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                Envío a todo el Paraguay
            </div>
        </div>
    </div>

    <div class="sticky top-[73px] bg-black/95 z-40 py-4 border-b border-gray-900 overflow-x-auto">
        <div class="container mx-auto px-4 flex space-x-2">
            <button class="tab-btn px-8 py-2 rounded-full bg-orange-500 text-black font-black text-xs" data-cat="todo">TODOS</button>
            <button class="tab-btn px-8 py-2 rounded-full bg-gray-900 text-gray-400 font-black text-xs" data-cat="lifepod">CARTUCHOS</button>
            <button class="tab-btn px-8 py-2 rounded-full bg-gray-900 text-gray-400 font-black text-xs" data-cat="kit">KITS</button>
            <button class="tab-btn px-8 py-2 rounded-full bg-gray-900 text-gray-400 font-black text-xs" data-cat="baterias">BATERÍAS</button>
        </div>
    </div>

    <main class="container mx-auto px-4 py-10">
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        <div id="no-results" class="hidden text-center py-24">
            <p class="text-gray-700 text-xl font-bold uppercase italic opacity-30 tracking-tighter">Sin resultados</p>
        </div>
    </main>

    <div id="overlay" class="overlay" onclick="toggleCart()"></div>
    <div id="cart-sidebar" class="cart-sidebar flex flex-col shadow-2xl">
        <div class="p-6 border-b border-gray-800 flex justify-between items-center bg-black">
            <h2 class="text-2xl font-black italic tracking-tighter uppercase">Mi Pedido</h2>
            <button onclick="toggleCart()" class="text-gray-500 hover:text-white p-2">✕</button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
        <div class="p-6 border-t border-gray-800 bg-black">
            <div class="flex justify-between mb-6 text-2xl font-black uppercase">
                <span>Total:</span>
                <span id="cart-total" class="text-orange-500">₲0</span>
            </div>
            <button onclick="checkout()" class="w-full bg-gradient-brand py-5 rounded-2xl font-black text-black uppercase tracking-widest hover:scale-[1.02] transition-transform shadow-lg shadow-orange-500/20">
                Finalizar por WhatsApp
            </button>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: 'Lifepod Device 650mAh', price: 45000, cat: 'baterias', img: 'img/1.webp' },
            { id: 2, name: 'Eco II Watermelon 10K', price: 70000, cat: 'lifepod', img: 'img/2.webp' },
            { id: 3, name: 'Eco II Love 66 10K', price: 70000, cat: 'lifepod', img: 'img/3.webp' },
            { id: 4, name: 'Eco II Polar Ice 10K', price: 70000, cat: 'lifepod', img: 'img/4.webp' },
            { id: 5, name: 'Kit Grape Honey 10K', price: 110000, cat: 'kit', img: 'img/5.webp' },
            { id: 6, name: 'Kit Menthol 10K', price: 110000, cat: 'kit', img: 'img/6.webp' },
            { id: 7, name: 'Kit Pink Lemonade 10K', price: 110000, cat: 'kit', img: 'img/7.webp' },
            { id: 8, name: 'Eco II Monster Drink 10K', price: 70000, cat: 'lifepod', img: 'img/8.webp' },
            { id: 9, name: 'Eco II White Mocha Choc 10K', price: 70000, cat: 'lifepod', img: 'img/9.webp' },
            { id: 11, name: 'Eco II Kiwi Berry 10K', price: 70000, cat: 'lifepod', img: 'img/10.webp' },
            { id: 12, name: 'Eco II Banana Ice 10K', price: 70000, cat: 'lifepod', img: 'img/11.webp' }
        ];

        let cart = [];
        let currentFilter = 'todo';

        function renderProducts(data = products) {
            const grid = document.getElementById('product-grid');
            const noResults = document.getElementById('no-results');
            grid.innerHTML = '';
            
            if (data.length === 0) { noResults.classList.remove('hidden'); } 
            else {
                noResults.classList.add('hidden');
                data.forEach(p => {
                    grid.innerHTML += `
                        <div onclick="addToCart(${p.id})" class="product-card rounded-3xl p-4 flex flex-col group">
                            <div class="mb-4 bg-white rounded-2xl overflow-hidden aspect-square flex items-center justify-center p-3">
                                <img src="${p.img}" class="max-w-full max-h-full object-contain group-hover:scale-110 transition-transform duration-500" onerror="this.src='https://via.placeholder.com/400/111/f97/text=PodHub'">
                            </div>
                            <h3 class="font-black text-lg mb-1 group-hover:text-orange-500 transition-colors uppercase italic leading-tight">${p.name}</h3>
                            <div class="mt-auto flex items-center justify-between pt-4">
                                <span class="text-2xl font-black tracking-tighter">₲${p.price.toLocaleString()}</span>
                                <div class="bg-orange-500 rounded-full w-10 h-10 flex items-center justify-center text-black font-black shadow-lg">+</div>
                            </div>
                        </div>
                    `;
                });
            }
        }

        function filterProducts() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = products.filter(p => {
                const matchesName = p.name.toLowerCase().includes(query);
                let alias = "";
                if (query.includes("cartucho") || query.includes("pod")) alias = "lifepod";
                if (query.includes("bateria") || query.includes("dispositivo")) alias = "baterias";
                if (query.includes("kit")) alias = "kit";
                const matchesAlias = p.cat === alias;
                const matchesTab = currentFilter === 'todo' || p.cat === currentFilter;
                return (matchesName || matchesAlias) && matchesTab;
            });
            renderProducts(filtered);
        }

        function toggleCart() {
            document.getElementById('cart-sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('active');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const inCart = cart.find(item => item.id === id);
            if (inCart) inCart.qty++; else cart.push({...product, qty: 1});
            updateCartUI();
            if (!document.getElementById('cart-sidebar').classList.contains('open')) toggleCart();
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            const count = document.getElementById('cart-count');
            const total = document.getElementById('cart-total');
            container.innerHTML = cart.length === 0 ? '<div class="text-center py-20 opacity-20 font-black text-xl italic uppercase">Vacio</div>' : '';
            let totalVal = 0, totalQty = 0;

            cart.forEach(item => {
                totalVal += item.price * item.qty;
                totalQty += item.qty;
                container.innerHTML += `
                    <div class="flex items-center space-x-4 bg-gray-900/50 p-4 rounded-3xl border border-gray-800 relative group">
                        <img src="${item.img}" class="w-16 h-16 object-contain bg-white rounded-xl p-1">
                        <div class="flex-1">
                            <h4 class="font-bold text-xs pr-6 uppercase leading-tight">${item.name}</h4>
                            <p class="text-orange-500 font-black text-sm">₲${item.price.toLocaleString()}</p>
                            <div class="flex items-center space-x-4 mt-2">
                                <button onclick="event.stopPropagation(); changeQty(${item.id}, -1)" class="w-7 h-7 bg-gray-800 rounded-lg hover:bg-orange-500 hover:text-black font-bold transition-all">-</button>
                                <span class="font-black text-xs">${item.qty}</span>
                                <button onclick="event.stopPropagation(); changeQty(${item.id}, 1)" class="w-7 h-7 bg-gray-800 rounded-lg hover:bg-orange-500 hover:text-black font-bold transition-all">+</button>
                            </div>
                        </div>
                        <button onclick="event.stopPropagation(); removeFromCart(${item.id})" class="absolute top-4 right-4 text-gray-600 hover:text-red-500 transition-colors">
                            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </button>
                    </div>
                `;
            });
            count.textContent = totalQty;
            total.textContent = `₲${totalVal.toLocaleString()}`;
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            item.qty += delta;
            if (item.qty <= 0) return removeFromCart(id);
            updateCartUI();
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartUI();
        }

        function checkout() {
            if (cart.length === 0) return;
            let msg = "¡Hola Pod Hub! Quiero confirmar este pedido:%0A%0A";
            cart.forEach(i => msg += `• *${i.name}* (x${i.qty})%0A`);
            msg += `%0A💰 *TOTAL: ${document.getElementById('cart-total').textContent}*`;
            window.open(`https://wa.me/595983367730?text=${msg}`);
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.classList.remove('bg-orange-500', 'text-black');
                    b.classList.add('bg-gray-900', 'text-gray-400');
                });
                e.target.classList.add('bg-orange-500', 'text-black');
                e.target.classList.remove('bg-gray-900', 'text-gray-400');
                currentFilter = e.target.dataset.cat;
                filterProducts();
            });
        });

        renderProducts();
    </script>
</body>
</html>
